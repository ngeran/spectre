# ============================================================================
# 🌊 ABYSSAL BLOOM - Ghostty Terminal Configuration
# ============================================================================
# Optimized for MSI 321URX QD-OLED (4K)
# Strategy: Void black substrate, phosphor teal bloom, distinct color spectrum.
# The abyss is dark. Only living things glow.
# ============================================================================

# ----------------------------------------------------------------------------
# CORE UI (Abyssal Bloom Palette)
# ----------------------------------------------------------------------------

# Background: Absolute Void (Pixels OFF)
background = 000000

# Foreground: Abyssal Mist — teal-shifted, low power, high clarity
# #5a7a72 sits in the cool-green teal band, readable without blasting power
foreground = 5a7a72

# Cursor: Phosphor Bloom — warm teal-green, easier on OLED than pure cyan
# Leans on the green subpixel (most efficient and durable on QD-OLED)
cursor-color = 00e8c0
cursor-text = 000000
cursor-style = block
cursor-style-blink = false

# Selection: Trench Shadow — near-black teal tint, recessive
selection-background = 0a1614
selection-foreground = 7a9e96

# ----------------------------------------------------------------------------
# WINDOW APPEARANCE
# ----------------------------------------------------------------------------
window-padding-x = 10
window-padding-y = 10
window-decoration = false
confirm-close-surface = false

# ----------------------------------------------------------------------------
# TERMINAL PALETTE (ANSI 16 — ABYSSAL BLOOM SPEC)
# ----------------------------------------------------------------------------

# --- NORMAL COLORS (Abyss Layer — barely lit, recessive) ---

# Black (Void Black — near-true, single pixel warmth)
palette = 0=0a0e0d

# Red (Bioluminescent Threat — deep crimson, danger in the dark)
palette = 1=4a2028

# Green (Abyssal Kelp — dark growth)
palette = 2=1a4a38

# Yellow (Amber Sediment — warm, buried)
palette = 3=3a3018

# Blue (Midnight Trench — deepest blue)
palette = 4=1a2a4a

# Magenta (Violet Brine — pressure and depth)
palette = 5=32184a

# Cyan (Phosphor Shadow — the dark side of the bloom)
palette = 6=0e3a34

# White (Deep Surface — grey-teal, muted)
palette = 7=3a4e4a

# --- BRIGHT COLORS (Bloom Layer — creatures lighting the dark) ---

# Bright Black (Gloom — lifted void)
palette = 8=1a2e2a

# Bright Red (Coral Flare — warm danger, vivid but not harsh)
palette = 9=c0404a

# Bright Green (Phosphor Bloom — the signature teal-green pulse)
palette = 10=00b890

# Bright Yellow (Bioluminescent Amber — anglerfish lure warmth)
palette = 11=c08830

# Bright Blue (Deep Water Blue — clear and navigable)
palette = 12=3a70c0

# Bright Magenta (Violet Depth — the one warm-cool surprise)
palette = 13=8040c0

# Bright Cyan (Abyssal Teal — core identity color)
palette = 14=00a890

# 💎 COLOR 15 (Sea Glass — perceived white, teal-biased for OLED efficiency)
# Reads as soft white due to green-teal channel bias, safer than neutral grey
palette = 15=70a098

# ----------------------------------------------------------------------------
# FONT & RENDERING
# ----------------------------------------------------------------------------
# font-family = "JetBrains Mono"
# font-size = 12
# font-feature = -calt # Disabling ligatures can reduce static pixel clusters

# Performance
adjust-cursor-thickness = 1

# Helps Ghostty render darker colors more accurately on high-refresh OLEDs
# font-thicken = true

# ============================================================================
# 💡 ABYSSAL BLOOM OPTIMIZATION NOTES
# ============================================================================
# 1. Sea Glass Trick: Palette 15 (#70a098) reads as near-white due to the
#    green-teal channel bias (D65-adjacent), but uses less total power than
#    neutral grey equivalents. Evolved from Singularity's chromatic white.
#
# 2. Phosphor Cursor: #00e8c0 leans heavily on the green subpixel — the most
#    efficient and long-lived on QD-OLED panels. Warmer than the old #33ffff,
#    less blue subpixel load, same perceived pop.
#
# 3. True Black: Any pixel not rendering text is physically OFF.
#
# 4. Bright Spectrum Design: Colors 9–14 are real, distinct hues — coral,
#    phosphor green, amber, blue, violet, teal — so errors, warnings, paths,
#    and info are immediately distinguishable at a glance.
#
# 5. Violet Depth (color13): The intentional outlier. Breaks the teal
#    monotony and gives memory/magenta outputs a unique signature.
# ============================================================================
