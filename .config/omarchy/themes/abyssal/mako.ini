# ============================================================================
# 🌌 COSMOS - Mako Notification Daemon Configuration
# ============================================================================
# OLED-optimized notifications with dark cosmic accents
# ============================================================================

# Pure black background
background-color=#000000

# Dark gray text (35% luminance)
text-color=#595959

# Very dark cyan border (28% luminance)
border-color=#2d6060

border-size=2
border-radius=8

width=420
height=120
padding=15
margin=10
outer-margin=20

anchor=top-right
layer=overlay

font=Liberation Sans 11
markup=1
format=<b>%s</b>\n%b

default-timeout=5000
max-visible=5
sort=-time

max-icon-size=48
icon-path=/usr/share/icons/Yaru-prussiangreen

# Low urgency: Very dark teal
[urgency=low]
border-color=#2d4848
default-timeout=3000

# Normal urgency: Very dark cyan
[urgency=normal]
border-color=#2d6060
default-timeout=5000

# Critical urgency: Dark coral
[urgency=critical]
border-color=#6a3838
text-color=#666666
default-timeout=0
ignore-timeout=1

# App-specific
[app-name=Spotify]
invisible=1

[app-name=volume]
border-color=#6a5838
default-timeout=2000

[app-name=brightness]
border-color=#6a5838
default-timeout=2000

[app-name=battery]
border-color=#5a3030
urgency=critical

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
