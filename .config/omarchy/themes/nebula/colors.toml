# ============================================================================
# 🌌 SINGULARITY (OLED Optimized)
# The void speaks in teal. Deep oceanic silence on pure black.
# Style: monochrome-tinted | Base Hue: 180° | OLED True Black
# ============================================================================
# Format: key = "#HEX" (Strict)
# ============================================================================
# CORE UI
background    = "#000000"
foreground    = "#94a8a8"  # Brightened significantly for reading comfort
accent        = "#4a7a7a"
accent_bright = "#2d8a8a"  # Reduced luminance from #45c2c2 — OLED burn-in safe
cursor        = "#b3caca"  # Shifted to frosty silver-teal — cohesive & low-stress
selection_bg  = "#162428"  # Raised slightly for better visibility
selection_fg  = "#b3caca"
# TERMINAL PALETTE (ANSI 16)
# ────────────────────────────────────────────────────────────────────────────
# DARK SPECTRUM (Dusty, lower-contrast for inactive elements/comments)
color0  = "#0d1011"  # Black
color1  = "#8c4343"  # Red
color2  = "#4a7856"  # Green
color3  = "#8f784b"  # Yellow
color4  = "#48678c"  # Blue
color5  = "#7d5482"  # Magenta
color6  = "#488282"  # Cyan
color7  = "#667a7a"  # White (Dim)
# BRIGHT SPECTRUM (Pastel, legible for syntax highlighting)
color8  = "#2a3233"  # Bright Black (Comments/Guides)
color9  = "#d16969"  # Bright Red (Errors)
color10 = "#76a882"  # Bright Green (Strings/Success)
color11 = "#c9a96e"  # Bright Yellow (Warnings/Classes)
color12 = "#6b8eb3"  # Bright Blue (Functions/Directories)
color13 = "#a87eb0"  # Bright Magenta (Keywords)
color14 = "#65b3b3"  # Bright Cyan (Variables/Symlinks)
# 💎 THE IMPROVED COLOR15 (Spectral Silver)
color15 = "#a3b8b8"  # Brighter, frosty teal-silver for maximum contrast text
