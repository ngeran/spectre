# ============================================================================
# 🌌 KOSMOS v2: SINGULARITY (Improved) - Ghostty Terminal Configuration
# ============================================================================
# Optimized for MSI 321URX QD-OLED (4K)
# Strategy: High readability, frosted pastels on true black to prevent eye
# strain while maintaining zero-pixel-burn background.
# ============================================================================
# ----------------------------------------------------------------------------
# CORE UI (Singularity Palette)
# ----------------------------------------------------------------------------
# Background: Absolute Void (Pixels OFF)
background = 000000
# Foreground: Spectral Ash (Brightened to #94a8a8 for comfortable contrast)
foreground = 94a8a8
# Cursor: Frosty Silver-Teal (Shifted from #45c2c2 — OLED burn-in safe)
cursor-color = b3caca
cursor-text = 000000
cursor-style = block
cursor-style-blink = false
# Selection: Event Horizon (Slightly raised for visibility)
selection-background = 162428
selection-foreground = b3caca
# ----------------------------------------------------------------------------
# WINDOW APPEARANCE
# ----------------------------------------------------------------------------
window-padding-x = 10
window-padding-y = 10
window-decoration = false
confirm-close-surface = false
# ----------------------------------------------------------------------------
# TERMINAL PALETTE (ANSI 16 - SINGULARITY SPEC)
# ----------------------------------------------------------------------------
# --- NORMAL COLORS (Dusty, lower-contrast for inactive elements) ---
# Black (Dark Matter)
palette = 0=0d1011
# Red (Dusty Crimson)
palette = 1=8c4343
# Green (Pine)
palette = 2=4a7856
# Yellow (Brass)
palette = 3=8f784b
# Blue (Muted Slate)
palette = 4=48678c
# Magenta (Plum)
palette = 5=7d5482
# Cyan (Deep Teal)
palette = 6=488282
# White (Dim Ash)
palette = 7=667a7a
# --- BRIGHT COLORS (Pastel & Legible for Syntax) ---
# Bright Black (Steel Guides)
palette = 8=2a3233
# Bright Red (Soft Flare)
palette = 9=d16969
# Bright Green (Mint)
palette = 10=76a882
# Bright Yellow (Sandstone)
palette = 11=c9a96e
# Bright Blue (Glacier)
palette = 12=6b8eb3
# Bright Magenta (Lilac)
palette = 13=a87eb0
# Bright Cyan (Frost Cyan)
palette = 14=65b3b3
# 💎 THE IMPROVED COLOR 15 (Spectral Silver)
# Brighter, frosty teal-silver for maximum contrast text without pure white harshness.
palette = 15=a3b8b8
# ----------------------------------------------------------------------------
# FONT & RENDERING
# ----------------------------------------------------------------------------
# font-family = "JetBrains Mono"
# font-size = 12
# font-feature = -calt # Disabling ligatures can reduce static pixel clusters
# Performance
adjust-cursor-thickness = 1
# This helps Ghostty render darker colors more accurately on high-refresh OLEDs
# font-thicken = true
# ============================================================================
# 💡 SINGULARITY OPTIMIZATION NOTES
# ============================================================================
# 1. Chromatic White Trick: Palette 15 (#a3b8b8) is a frosty silver that reads
#    cleanly as white against pure black, reducing overall subpixel intensity.
# 2. Softened Cursor: Cursor (#b3caca) shifted from neon (#45c2c2) to frosty
#    silver-teal — matches selection_fg and color15, cohesive and OLED-safe.
# 3. True Black: Any part of the screen not showing text is physically OFF.
# ============================================================================
