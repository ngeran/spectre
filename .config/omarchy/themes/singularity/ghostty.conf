# ============================================================================
# 🌌 KOSMOS v2: SINGULARITY - Ghostty Terminal Configuration
# ============================================================================
# Optimized for MSI 321URX QD-OLED (4K)
# Strategy: Chromatic-balanced silver for "fake" high contrast at low power.
# ============================================================================

# ----------------------------------------------------------------------------
# CORE UI (Singularity Palette)
# ----------------------------------------------------------------------------

# Background: Absolute Void (Pixels OFF)
background = 000000

# Foreground: Spectral Ash (Chromatic-balanced for clarity at low power)
# #607575 is the high-efficiency equivalent of #595959
foreground = 607575

# Cursor: Photon Blue (High visibility, ultra-low subpixel drive)
cursor-color = 33ffff
cursor-text = 000000
cursor-style = block
cursor-style-blink = false

# Selection: Event Horizon (Recessive blue)
selection-background = 101a1d
selection-foreground = 809a9a

# ----------------------------------------------------------------------------
# WINDOW APPEARANCE
# ----------------------------------------------------------------------------
window-padding-x = 10
window-padding-y = 10
window-decoration = false
confirm-close-surface = false

# ----------------------------------------------------------------------------
# TERMINAL PALETTE (ANSI 16 - SINGULARITY SPEC)
# ----------------------------------------------------------------------------

# --- NORMAL COLORS (Recessive/Dark Spectrum) ---

# Black (Dark Matter)
palette = 0=0d1011
# Red (Infrared)
palette = 1=523333
# Green (Nebula Green)
palette = 2=335240
# Yellow (Cosmic Dust)
palette = 3=524833
# Blue (Gravity Blue)
palette = 4=334052
# Magenta (Void Purple)
palette = 5=483352
# Cyan (Dark Cyan)
palette = 6=335252
# White (Cold Lead)
palette = 7=505a5a

# --- BRIGHT COLORS (Luminance Cap: 45%) ---

# Bright Black (Steel)
palette = 8=2a3233
# Bright Red (Solar Flare)
palette = 9=7a4a4a
# Bright Green (Aurora Green)
palette = 10=4a7a5c
# Bright Yellow (Starfire Gold)
palette = 11=7a6a4a
# Bright Blue (Comet Blue)
palette = 12=4a5c7a
# Bright Magenta (Pulsar Violet)
palette = 13=6a4a7a
# Bright Cyan (Ionized Cyan)
palette = 14=4a7a7a

# 💎 THE IMPROVED COLOR 15 (Spectral Silver)
# Perceived as "Pure White" due to blue-bias, but safe for 100k hours.
palette = 15=708282

# ----------------------------------------------------------------------------
# FONT & RENDERING
# ----------------------------------------------------------------------------
# font-family = "JetBrains Mono"
# font-size = 12
# font-feature = -calt # Disabling ligatures can reduce static pixel clusters

# Performance
adjust-cursor-thickness = 1
# This helps Ghostty render darker colors more accurately on high-refresh OLEDs
# font-thicken = true

# ============================================================================
# 💡 SINGULARITY OPTIMIZATION NOTES
# ============================================================================
# 1. Chromatic White Trick: Palette 15 (#708282) looks whiter than #808080 
#    to the human eye because of the D65-offset, but uses less total power.
# 2. Photon Blue Cursor: Using #33ffff is highly efficient on QD-OLED 
#    as it utilizes the most resilient subpixels (Green/Blue) to pop.
# 3. True Black: Any part of the screen not showing text is physically OFF.
# ============================================================================
