# ============================================================================
# 🌌 KOSMOS v2: SINGULARITY - Hyprlock Configuration
# ============================================================================
# Optimized for OLED: Pure black backgrounds and Spectral Silver text.
# Uses chromatic-balanced whites to reduce burn-in risk.
# ============================================================================

# CORE SURFACES
$background_color   = rgba(0, 0, 0, 1.0)       # Absolute Black (Pixels OFF)
$inner_color        = rgba(0, 0, 0, 1.0)       # Input field void
$outer_color        = rgba(51, 82, 82, 0.4)    # Faint Spectral Glow (Border)
$overlay_color      = rgba(0, 0, 0, 0.5)       # Dimming layer

# TYPOGRAPHY (The "Spectral Silver" Core)
# rgba(112, 130, 130, 1.0) matches #708282
$font_color         = rgba(112, 130, 130, 1.0) # Spectral Silver (Primary Text)
$placeholder_color  = rgba(80, 90, 90, 0.7)    # Dimmed Nebula Gray

# STATE COLORS (Singularity Palette)
$check_color        = rgba(74, 122, 122, 1.0)  # Ionized Cyan (Success/Validation)
$highlight_color    = rgba(51, 255, 255, 0.6)  # Photon Blue (Active typing)
$typing_color       = rgba(51, 82, 82, 1.0)    # Deep Gravity Blue
$error_color        = rgba(122, 74, 74, 1.0)   # Solar Flare Red (Alert)
$warning_color      = rgba(122, 106, 74, 1.0)  # Starfire Gold (Warning)

# ============================================================================
# 💡 IMPLEMENTATION NOTE: 
# To maximize OLED life, keep your 'outer_thickness' small (2-3px) 
# and use 'dots_size' around 0.2 for the password input.
# ============================================================================
