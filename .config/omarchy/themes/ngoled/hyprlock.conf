#     inner_color = $inner_color
#     font_color = $font_color
#     fade_on_empty = false
#     placeholder_text = <span foreground="##c8c8c8">Enter Password...</span>
#     check_color = $check_color
#     fail_color = $error_color
#     capslock_color = $warning_color
#     position = 0, -120
#     halign = center
#     valign = center
