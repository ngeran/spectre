# ============================================================================
# Hyprlock Configuration - ngoled Theme
# ============================================================================
# OLED-optimized lock screen with cyan accents
# All colors use rgba(R, G, B, A) format where values are 0-255
# ============================================================================

# ----------------------------------------------------------------------------
# COLOR DEFINITIONS (RGBA Format)
# ----------------------------------------------------------------------------

# Background: Pure OLED black (fully opaque)
$color = rgba(0, 0, 0, 1)

# Inner elements: Pure OLED black
$inner_color = rgba(0, 0, 0, 1)

# Outer ring/border: Neutral gray (semi-transparent)
# Changed from #EFEFEF to #c8c8c8 (200, 200, 200)
$outer_color = rgba(200, 200, 200, 0.5)

# Font/text: Neutral gray (fully opaque)
# Changed from #EFEFEF to #c8c8c8
$font_color = rgba(200, 200, 200, 1)

# Placeholder text: Neutral gray (dimmed)
# Changed from #EFEFEF to #c8c8c8 with lower opacity
$placeholder_color = rgba(200, 200, 200, 0.6)

# Check/success indicator: Balanced cyan (accent color)
# Changed from orange #F59E0B to cyan #4a9d9d (74, 157, 157)
$check_color = rgba(74, 157, 157, 1.0)

# Error indicator: Warm coral (not alarming)
# New: For failed login attempts
$error_color = rgba(181, 106, 106, 1.0)

# Highlight/active: Bright cyan
# New: For active input field
$highlight_color = rgba(96, 208, 208, 1.0)

# ----------------------------------------------------------------------------
# ADDITIONAL SEMANTIC COLORS
# ----------------------------------------------------------------------------

# Caps Lock warning
$warning_color = rgba(200, 166, 96, 1.0)

# Typing indicator
$typing_color = rgba(122, 151, 105, 1.0)

# Fade overlay for background blur
$overlay_color = rgba(0, 0, 0, 0.3)

# ============================================================================
# USAGE IN HYPRLOCK CONFIG
# ============================================================================
# Background
# background {
#     monitor =
#     path = screenshot   # or path to wallpaper
#     color = $color
#     blur_passes = 3
#     blur_size = 8
# }
#
