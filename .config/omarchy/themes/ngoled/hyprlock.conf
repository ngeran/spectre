# ============================================================================

# ============================================================================
# COLOR PALETTE REFERENCE
# ============================================================================
# Pure Black:      rgba(0, 0, 0, 1)       - Background
# Neutral Gray:    rgba(200, 200, 200, 1) - Text (#c8c8c8)
# Balanced Cyan:   rgba(74, 157, 157, 1)  - Success/Check (#4a9d9d)
# Bright Cyan:     rgba(96, 208, 208, 1)  - Highlights (#60d0d0)
# Warm Coral:      rgba(181, 106, 106, 1) - Errors (#b56a6a)
# Amber Gold:      rgba(200, 166, 96, 1)  - Warnings (#c8a660)
# Sage Green:      rgba(122, 151, 105, 1) - Typing (#7a9769)
# ============================================================================
