# ============================================================================
# Mako Notification Daemon - ngoled Theme
# ============================================================================
# OLED-optimized notification styling
# Strategy: Pure black background, cyan accents, no pure whites
# ============================================================================

# ----------------------------------------------------------------------------
# CORE APPEARANCE
# ----------------------------------------------------------------------------

# Background: Pure OLED black
background-color=#000000

# Text: Neutral gray (WCAG AAA: 8.6:1 contrast)
# - Never pure white to prevent burn-in
text-color=#c8c8c8

# Border: Balanced cyan (matches accent)
# - Modern, visible without being harsh
border-color=#4a9d9d

# Border styling
border-size=2
border-radius=8

# ----------------------------------------------------------------------------
# DIMENSIONS & SPACING
# ----------------------------------------------------------------------------

# Width: Comfortable reading width
width=420

# Height: Adaptive to content
height=120

# Padding: Breathing room for text
padding=15

# Margins: Space from screen edge
margin=10
outer-margin=20

# ----------------------------------------------------------------------------
# POSITIONING
# ----------------------------------------------------------------------------

# Anchor: Top-right corner (common convention)
anchor=top-right

# Layer: Above normal windows
layer=overlay

# ----------------------------------------------------------------------------
# TYPOGRAPHY
# ----------------------------------------------------------------------------

# Font: Clean sans-serif at readable size
font=Liberation Sans 11

# Markup: Enable for rich formatting
markup=1

# Format: Show app name and summary
format=<b>%s</b>\n%b

# ----------------------------------------------------------------------------
# BEHAVIOR
# ----------------------------------------------------------------------------

# Timeout: Auto-dismiss after 5 seconds
default-timeout=5000

# Ignore timeout: Allow manual dismissal
ignore-timeout=0

# Max visible: Stack up to 5 notifications
max-visible=5

# Sort: Newest on top
sort=-time

# ----------------------------------------------------------------------------
# ICONS
# ----------------------------------------------------------------------------

# Icon size: Balanced visibility
max-icon-size=48
icon-path=/usr/share/icons/Yaru-prussiangreen

# ----------------------------------------------------------------------------
# URGENCY LEVELS (Color-coded by priority)
# ----------------------------------------------------------------------------

# Low urgency: Subtle cyan-gray
[urgency=low]
border-color=#4f8a8b
default-timeout=3000

# Normal urgency: Balanced cyan (default)
[urgency=normal]
border-color=#4a9d9d
default-timeout=5000

# Critical urgency: Warm coral (attention without alarm)
[urgency=critical]
border-color=#b56a6a
text-color=#d0d0d0
default-timeout=0
ignore-timeout=1

# ----------------------------------------------------------------------------
# APP-SPECIFIC OVERRIDES
# ----------------------------------------------------------------------------

# Spotify: Hide music notifications (often spammy)
[app-name=Spotify]
invisible=1

# Volume notifications: Brief display
[app-name=volume]
border-color=#c8a660
default-timeout=2000

# Brightness notifications: Brief display
[app-name=brightness]
border-color=#c8a660
default-timeout=2000

# Battery warnings: Critical styling
[app-name=battery]
border-color=#b85a5a
urgency=critical

# Screenshot notifications: Success green
[app-name=screenshot]
border-color=#7a9769
default-timeout=3000

# ----------------------------------------------------------------------------
# DO NOT DISTURB MODE
# ----------------------------------------------------------------------------

# DND: Hide all notifications
[mode=do-not-disturb]
invisible=true

# DND Exception: Allow manual notify-send
[mode=do-not-disturb app-name=notify-send]
invisible=false

# ============================================================================
# DESIGN NOTES
# ============================================================================
# Color Strategy:
#   - Background: Pure OLED black (#000000)
#   - Text: Neutral gray (#c8c8c8) - WCAG AAA
#   - Border: Cyan (#4a9d9d) - theme accent
#   - Critical: Warm coral (#b56a6a) - non-alarming alert
#
# Urgency Color Mapping:
#   - Low → Deep teal (#4f8a8b)
#   - Normal → Balanced cyan (#4a9d9d)
#   - Critical → Warm coral (#b56a6a)
#
# ✓ No pure whites anywhere
# ✓ Sub-pixel balanced colors
# ✓ Readable at arm's length
# ✓ Non-intrusive design
# ============================================================================
