# ============================================================================
# Ghostty Terminal Configuration - ngoled Theme (FIXED)
# ============================================================================
# OLED Optimization Strategy:
#   - Pure black background (#000000)
#   - No pure whites (max #d0d0d0)
#   - Sub-pixel balanced palette
#   - Matches colors.toml design system
# ============================================================================

# ----------------------------------------------------------------------------
# CORE COLORS
# ----------------------------------------------------------------------------

# Background: Pure OLED black (all pixels off)
background = 000000

# Foreground: Neutral gray with excellent readability
# - 8.6:1 contrast ratio (WCAG AAA)
# - THIS WAS YOUR ISSUE: The foreground needs to be set correctly
foreground = c8c8c8

# Cursor: Balanced cyan (matches accent)
cursor-color = 5fb3b3

# Cursor Text: Deep charcoal for contrast
cursor-text = 1a1b26

# Selection Background: Subtle teal-gray
selection-background = 2a3f50

# Selection Foreground: High-contrast light gray
selection-foreground = e0e0e0

# ----------------------------------------------------------------------------
# WINDOW APPEARANCE
# ----------------------------------------------------------------------------

# Padding: Balanced spacing for modern aesthetic
window-padding-y = 8,8
window-padding-x = 8,8
window-padding-balance = true

# Font configuration (optional - uncomment to use)
# font-family = "JetBrains Mono"
# font-size = 13

# ----------------------------------------------------------------------------
# TERMINAL PALETTE (16 ANSI Colors)
# ----------------------------------------------------------------------------
# Format: palette = INDEX=HEXCOLOR (no # prefix needed)
# Matches colors.toml palette exactly
# ----------------------------------------------------------------------------

# --- NORMAL COLORS (0-7) ---

# Black: Deep charcoal
palette = 0=1a1b26

# Red: Dried rose (muted terracotta)
palette = 1=b85a5a

# Green: Moss green (forest tone)
palette = 2=6a8759

# Yellow: Amber gold (warm, low blue-light)
palette = 3=b89650

# Blue: Sky cyan (cyan-shifted protection)
palette = 4=4a8a9d

# Magenta: Twilight purple (deep plum)
palette = 5=8e6f9e

# Cyan: Deep teal (ocean tone)
palette = 6=4f8a8b

# White: Neutral gray (safe foreground)
palette = 7=b8b8b8

# --- BRIGHT COLORS (8-15) ---

# Bright Black: Lifted slate gray
palette = 8=3e4451

# Bright Red: Warm coral
palette = 9=b56a6a

# Bright Green: Sage green
palette = 10=7a9769

# Bright Yellow: Bright gold
palette = 11=c8a660

# Bright Blue: Bright aqua
palette = 12=5a9aad

# Bright Magenta: Lavender
palette = 13=9e7fae

# Bright Cyan: Aquamarine
palette = 14=5f9a9b

# Bright White: Controlled maximum brightness (NEVER #ffffff)
palette = 15=d0d0d0

# ============================================================================
# TROUBLESHOOTING NOTES
# ============================================================================
# If text still appears white:
# 1. Check your shell prompt (PS1) - it may override colors
# 2. Verify no ~/.config/ghostty/config conflicts
# 3. Test with: echo -e "\e[0mNormal text\e[0m"
# 4. Restart Ghostty completely (not just reload)
#
# Expected result: Text should be #c8c8c8 (neutral gray), NOT white
# ============================================================================
